appId: au.blah.layup
productName: Layup
copyright: Layup
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Placed where main/index.ts:192 already looks: process.resourcesPath.
extraResources:
  - from: ../../dist/helper/layup-input-helper
    to: layup-input-helper

mac:
  category: public.app-category.productivity
  target:
    # Both, and both matter. The DMG is what a person downloads once; the zip is
    # the only thing Squirrel.Mac can update from - it cannot mount a DMG - so
    # without it there is a download page and no update path at all.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Reads APPLE_API_KEY (path to the .p8), APPLE_API_KEY_ID and
  # APPLE_API_ISSUER from the environment. Never commit any of them.
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signed with the same identity as the app, so TCC attributes the helper to
  # the parent bundle and one Accessibility grant covers both.
  binaries:
    - Contents/Resources/layup-input-helper
  extendInfo:
    # Their absence is not a missing prompt - it is a hard crash on the first
    # getUserMedia call.
    NSCameraUsageDescription: Layup shows your face to the person you are pairing with.
    NSMicrophoneUsageDescription: Layup carries your voice to the person you are pairing with.
    # Screen Recording is granted by prompt, not entitlement, but the string is
    # what the person reads when macOS asks.
    NSScreenCaptureUsageDescription: Layup shares your screen with the person you are pairing with.

dmg:
  artifactName: Layup-${version}-universal.dmg

# The update feed. Caddy serves /srv/layup/public, so the manifest and the
# artifacts sit together at https://layup.blah.au/download/. Generic means no
# provider account and no tokens: a directory, over https, and nothing else.
#
# Declaring it here is also what makes electron-builder emit latest-mac.yml at
# build time. Without that manifest nothing ever updates, and it looks exactly
# like it is working.
publish:
  - provider: generic
    url: https://layup.blah.au/download/
